# Workspace root for the cc-cad monorepo.
#
# Each app under apps/ has its own pyproject.toml:
#   - apps/cad/pyproject.toml        (agent-cad)
#   - apps/slicer/pyproject.toml     (agent-slicer, coming v0.2.0)
#
# This root file is intentionally NOT a [project] — it carries only
# workspace-level tooling config. Installer scripts pip-install each
# app individually into a single shared venv at the repo root, so the
# apps share heavy native deps (cadquery-ocp, vtk) instead of duplicating.

[tool.ruff]
line-length = 100
target-version = "py312"
