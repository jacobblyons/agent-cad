[project]
name = "agent-slicer"
version = "0.0.1"
description = "Visual, agent-driven 3MF slicer companion to Agent CAD"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pywebview>=5.3",
    "claude-agent-sdk>=0.1",
    "pillow>=10.0",
    "trimesh>=4.4",
    "numpy>=1.26",
    "httpx>=0.27",
    # paho-mqtt + imageio-ffmpeg moved here from agent-cad in v0.2.0:
    # they're slicer concerns (printer LAN, chamber camera) and don't
    # belong in the modeller anymore. They land here in Phase 8.
    # "paho-mqtt>=2.1",
    # "imageio-ffmpeg>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
